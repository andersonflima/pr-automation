# Esteira de PR reutilizável.
#
# 1. auto-merge: PR de uma branch de trabalho (feature/*, feat/*, fix/*,
#    chore/*, ci/*, docs/*, release/*, ...) para a branch de integração recebe
#    merge automático assim que os checks obrigatórios passam. Squash por
#    padrão; merge commit para as branches de sincronização (chore/sync-main-*),
#    que precisam manter a ancestralidade.
# 2. promote: cada push na branch de integração abre (ou reaproveita) o PR
#    integração → promoção e liga o merge automático (merge commit, para manter
#    a ancestralidade) quando os checks dele passam.
#
# As ações usam o token do GitHub App, não o GITHUB_TOKEN: um merge feito pelo
# GITHUB_TOKEN não dispara outros workflows, e a cadeia (merge → PR de
# promoção → checks → merge → deploy) pararia no primeiro passo.
#
# O merge automático depende de checks obrigatórios (proteção de branch ou
# ruleset) na branch de destino; sem isso o --auto faria o merge na hora, e o
# workflow recusa. O App não é ator de bypass, então os checks valem também
# para o merge direto do passo "armar" (veja ARM_MERGE abaixo).
name: pr-flow

on:
  workflow_call:
    inputs:
      app_id:
        description: ID do GitHub App que executa os merges.
        type: string
        required: true
      integration_branch:
        description: Branch que recebe as branches de trabalho (ex. develop).
        type: string
        required: true
      promotion_branch:
        description: Branch que recebe a integração (ex. homolog). Vazio desliga a promoção.
        type: string
        default: ""
      work_branch_pattern:
        description: Regex (ERE) dos nomes de branch com merge automático.
        type: string
        default: "^(feature|feat|fix|bugfix|hotfix|chore|ci|docs|refactor|perf|test|build|style|revert|deps|release)/"
      merge_method:
        description: Método do merge das branches de trabalho (squash, merge ou rebase).
        type: string
        default: squash
      merge_commit_pattern:
        description: Regex (ERE) das branches de trabalho que entram com merge commit, não com merge_method (sincronizações que precisam manter a ancestralidade).
        type: string
        default: "^(chore/sync-|sync/|back-?merge/)"
    secrets:
      app_private_key:
        required: true

permissions:
  contents: read

env:
  # Funções compartilhadas pelos jobs (carregadas com eval).
  #
  # require_checks: falha quando a branch não exige nenhum check (proteção
  # clássica ou ruleset).
  #
  # arm_merge: liga o merge automático e confere que ele ficou ligado. Quando o
  # SHA do PR já tem os checks obrigatórios verdes (o caso de todo PR de
  # promoção, porque o CI do push na branch de origem roda no mesmo SHA), o
  # GitHub recusa armar ("Pull request is in clean status") ou tenta o merge na
  # hora e desarma com "Repository rule violations found" assim que o CI do
  # pull_request entra pendente. Nesses casos faz o merge direto quando o PR
  # está CLEAN e volta a armar quando está BLOCKED, até ficar armado e estável
  # ou mergeado. O App não é bypass: o merge direto também exige os checks.
  ARM_MERGE: |
    require_checks() {
      local base=$1 classic rules
      classic=$(gh api "repos/$GITHUB_REPOSITORY/branches/$base" \
        --jq '[.protection.required_status_checks.checks[]?.context, .protection.required_status_checks.contexts[]?] | unique | length' 2>/dev/null || echo 0)
      rules=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$base" \
        --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]] | length' 2>/dev/null || echo 0)
      if [ "${classic:-0}" -eq 0 ] && [ "${rules:-0}" -eq 0 ]; then
        echo "::error::$base não exige nenhum check; o merge automático seria imediato, sem CI. Configure proteção ou ruleset com checks obrigatórios."
        return 1
      fi
      echo "$base exige checks (proteção: $classic, rulesets: $rules)."
    }
    arm_merge() {
      local pr=$1 method=$2 tries=${ARM_TRIES:-60} stable=0 info state armed mss out
      shift 2
      for _ in $(seq 1 "$tries"); do
        info=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,autoMergeRequest,mergeStateStatus)
        state=$(jq -r '.state' <<<"$info")
        armed=$(jq -r '.autoMergeRequest != null' <<<"$info")
        mss=$(jq -r '.mergeStateStatus' <<<"$info")
        case "$state" in
          MERGED) echo "PR #$pr mergeado."; return 0 ;;
          CLOSED) echo "::error::PR #$pr foi fechado sem merge."; return 1 ;;
        esac
        if [ "$armed" = true ]; then
          stable=$((stable + 1))
          if [ "$stable" -ge 3 ]; then
            echo "PR #$pr: merge automático ligado; entra quando os checks obrigatórios passarem."
            return 0
          fi
        else
          stable=0
          case "$mss" in
            CLEAN|HAS_HOOKS)
              out=$(gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" "$method" "$@" 2>&1) \
                || echo "Merge direto recusado por enquanto: $out" ;;
            DIRTY)
              echo "::error::PR #$pr tem conflito com a base; resolva para o merge automático seguir."
              return 1 ;;
            *)
              out=$(gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto "$method" "$@" 2>&1) \
                || echo "Merge automático não ligou ainda ($mss): $out" ;;
          esac
        fi
        sleep 10
      done
      echo "::error::PR #$pr não ficou com merge automático ligado nem foi mergeado."
      return 1
    }

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == inputs.integration_branch &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-flow-arm-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Branch de trabalho?
        id: match
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PATTERN: ${{ inputs.work_branch_pattern }}
          MERGE_COMMIT_PATTERN: ${{ inputs.merge_commit_pattern }}
          METHOD: ${{ inputs.merge_method }}
        run: |
          if printf '%s' "$HEAD_REF" | grep -Eq "$PATTERN"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $HEAD_REF fora do padrão $PATTERN; nada a fazer."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MERGE_COMMIT_PATTERN" ] && printf '%s' "$HEAD_REF" | grep -Eq "$MERGE_COMMIT_PATTERN"; then
            METHOD=merge
          fi
          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
      - name: Token do App
        if: steps.match.outputs.ok == 'true'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
      - name: Ligar merge automático
        if: steps.match.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ inputs.integration_branch }}
          PR: ${{ github.event.pull_request.number }}
          METHOD: ${{ steps.match.outputs.method }}
        run: |
          eval "$ARM_MERGE"
          require_checks "$BASE"
          arm_merge "$PR" "--$METHOD" --delete-branch

  promote:
    if: >-
      github.event_name == 'push' &&
      inputs.promotion_branch != '' &&
      github.ref_name == inputs.integration_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-flow-promote-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Token do App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
      - name: Abrir ou reaproveitar o PR de promoção e ligar o merge automático
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ inputs.promotion_branch }}
          HEAD: ${{ inputs.integration_branch }}
        run: |
          eval "$ARM_MERGE"
          require_checks "$BASE"
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "$HEAD não tem nada à frente de $BASE."
            exit 0
          fi
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            body=$(printf 'Promoção automática de `%s` para `%s`.\n\nCommits incluídos:\n\n%s\n' "$HEAD" "$BASE" \
              "$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')")
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$HEAD" \
              --title "release: $HEAD → $BASE" --body "$body")
            pr=${url##*/}
          fi
          arm_merge "$pr" --merge
