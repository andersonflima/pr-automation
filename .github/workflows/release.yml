# Release sob demanda: promove a branch validada (ex. homolog) para a de
# produção (ex. main).
#
# Disparado à mão (workflow_dispatch no repositório que chama), nunca a cada
# push: subir para produção é decisão do dono. Abre (ou reaproveita) o PR
# validada → produção e liga o merge automático com merge commit, para manter a
# ancestralidade; o merge só acontece quando os checks obrigatórios da branch de
# produção passam, e o deploy de produção segue do push na branch de produção.
# Quando o SHA já tem os checks verdes (CI do push na validada), o merge é feito
# direto, com as mesmas regras (veja ARM_MERGE).
#
# Antes de abrir, recusa se a branch de produção não exige checks (o --auto
# faria o merge na hora, sem CI) e avisa quando a produção tem commits que não
# estão na validada: eles entram no merge, mas vale trazê-los de volta para a
# validada depois, para as duas não divergirem.
name: release

on:
  workflow_call:
    inputs:
      app_id:
        description: ID do GitHub App que executa os merges.
        type: string
        required: true
      validated_branch:
        description: Branch validada que sobe (ex. homolog).
        type: string
        default: homolog
      production_branch:
        description: Branch de produção (ex. main).
        type: string
        default: main
    secrets:
      app_private_key:
        required: true

permissions:
  contents: read

env:
  # Funções compartilhadas pelos jobs (carregadas com eval).
  #
  # require_checks: falha quando a branch não exige nenhum check (proteção
  # clássica ou ruleset).
  #
  # arm_merge: liga o merge automático e confere que ele ficou ligado. Quando o
  # SHA do PR já tem os checks obrigatórios verdes (o caso de todo PR de
  # promoção, porque o CI do push na branch de origem roda no mesmo SHA), o
  # GitHub recusa armar ("Pull request is in clean status") ou tenta o merge na
  # hora e desarma com "Repository rule violations found" assim que o CI do
  # pull_request entra pendente. Nesses casos faz o merge direto quando o PR
  # está CLEAN e volta a armar quando está BLOCKED, até ficar armado e estável
  # ou mergeado. O App não é bypass: o merge direto também exige os checks.
  ARM_MERGE: |
    require_checks() {
      local base=$1 classic rules
      classic=$(gh api "repos/$GITHUB_REPOSITORY/branches/$base" \
        --jq '[.protection.required_status_checks.checks[]?.context, .protection.required_status_checks.contexts[]?] | unique | length' 2>/dev/null || echo 0)
      rules=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$base" \
        --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]] | length' 2>/dev/null || echo 0)
      if [ "${classic:-0}" -eq 0 ] && [ "${rules:-0}" -eq 0 ]; then
        echo "::error::$base não exige nenhum check; o merge automático seria imediato, sem CI. Configure proteção ou ruleset com checks obrigatórios."
        return 1
      fi
      echo "$base exige checks (proteção: $classic, rulesets: $rules)."
    }
    arm_merge() {
      local pr=$1 method=$2 tries=${ARM_TRIES:-60} stable=0 info state armed mss out
      shift 2
      for _ in $(seq 1 "$tries"); do
        info=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,autoMergeRequest,mergeStateStatus)
        state=$(jq -r '.state' <<<"$info")
        armed=$(jq -r '.autoMergeRequest != null' <<<"$info")
        mss=$(jq -r '.mergeStateStatus' <<<"$info")
        case "$state" in
          MERGED) echo "PR #$pr mergeado."; return 0 ;;
          CLOSED) echo "::error::PR #$pr foi fechado sem merge."; return 1 ;;
        esac
        if [ "$armed" = true ]; then
          stable=$((stable + 1))
          if [ "$stable" -ge 3 ]; then
            echo "PR #$pr: merge automático ligado; entra quando os checks obrigatórios passarem."
            return 0
          fi
        else
          stable=0
          case "$mss" in
            CLEAN|HAS_HOOKS)
              out=$(gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" "$method" "$@" 2>&1) \
                || echo "Merge direto recusado por enquanto: $out" ;;
            DIRTY)
              echo "::error::PR #$pr tem conflito com a base; resolva para o merge automático seguir."
              return 1 ;;
            *)
              out=$(gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto "$method" "$@" 2>&1) \
                || echo "Merge automático não ligou ainda ($mss): $out" ;;
          esac
        fi
        sleep 10
      done
      echo "::error::PR #$pr não ficou com merge automático ligado nem foi mergeado."
      return 1
    }

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Token do App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
      - name: Abrir ou reaproveitar o PR de release e ligar o merge automático
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ inputs.production_branch }}
          HEAD: ${{ inputs.validated_branch }}
        run: |
          eval "$ARM_MERGE"
          require_checks "$BASE"
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD")
          ahead=$(jq -r '.ahead_by' <<<"$compare")
          behind=$(jq -r '.behind_by' <<<"$compare")
          if [ "$ahead" = "0" ]; then
            echo "$HEAD não tem nada à frente de $BASE; produção já está em dia."
            exit 0
          fi
          if [ "$behind" != "0" ]; then
            echo "::warning::$BASE tem $behind commit(s) fora de $HEAD; entram no merge, mas traga-os para $HEAD depois."
          fi
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            body=$(printf 'Release de `%s` para `%s` (produção), disparada por @%s.\n\nCommits incluídos:\n\n%s\n' "$HEAD" "$BASE" "$GITHUB_ACTOR" \
              "$(jq -r '.commits[] | "- " + (.commit.message | split("\n")[0])' <<<"$compare")")
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$HEAD" \
              --title "release: $HEAD → $BASE (produção)" --body "$body")
            pr=${url##*/}
          fi
          arm_merge "$pr" --merge
          echo "PR #$pr: merge automático ligado (ou já mergeado); entra em $BASE quando os checks obrigatórios passarem." >> "$GITHUB_STEP_SUMMARY"
